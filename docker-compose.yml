services:
  postgres:
    image: postgres:16-alpine
    container_name: finkeeper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finkeeper
      POSTGRES_USER: finkeeper
      POSTGRES_PASSWORD: finkeeper
    ports:
      - "5432:5432"
    volumes:
      - finkeeper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finkeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: finkeeper-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  finkeeper_postgres_data:
