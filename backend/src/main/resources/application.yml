spring:
  application:
    name: financecash-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/financecash
    username: financecash
    password: financecash
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

financecash:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-para-algo-com-pelo-menos-256-bits}
    expiration-minutes: 720
  recurring-generation:
    # Roda todo dia às 05:00 (horário do servidor) — ver RecurringEntryScheduler.
    cron: "0 0 5 * * *"
    # Quantos meses à frente projetar os lançamentos recorrentes a cada execução.
    months-ahead: 12
  notifications:
    # Roda todo dia às 06:00, uma hora depois da geração de recorrências — ver
    # DueSoonAndBalanceNotificationScheduler.
    cron: "0 0 6 * * *"
    # Quantos dias à frente conta como "vencendo em breve" para o alerta.
    due-soon-days: 2
    # Remetente usado nos e-mails de alerta. Sem MAIL_HOST configurado, o envio
    # simplesmente falha e é logado — não derruba o job (ver SmtpEmailSender).
    email-from: ${MAIL_FROM:no-reply@financecash.local}
  pluggy:
    # Integração com Open Finance via Pluggy (ver docs/OPEN-FINANCE-E-BOLETOS.md).
    # Client ID/Secret vêm de meu.pluggy.ai + dashboard.pluggy.ai — nunca vão para o
    # repositório, só para variáveis de ambiente do backend.
    base-url: ${PLUGGY_BASE_URL:https://api.pluggy.ai}
    client-id: ${PLUGGY_CLIENT_ID:}
    client-secret: ${PLUGGY_CLIENT_SECRET:}
    # Quantos dias pra trás toda sincronização busca transações (ver AccountSyncService,
    # javadoc de transactionLookbackDays). 365 = 12 meses (1/10, a pedido do Marcio — com 120
    # dias não dava pra ver o histórico de itens anuais nem confirmar parcelamentos antigos
    # contra a planilha). Ainda uma configuração global do servidor, não por usuário.
    sync-window-days: ${PLUGGY_SYNC_WINDOW_DAYS:365}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.financecash: INFO
