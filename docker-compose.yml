services:
  postgres:
    image: postgres:16-alpine
    container_name: financecash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financecash
      POSTGRES_USER: financecash
      POSTGRES_PASSWORD: financecash
    ports:
      - "5432:5432"
    volumes:
      - financecash_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financecash"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: financecash-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  financecash_postgres_data:
