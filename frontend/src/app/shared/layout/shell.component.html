<div class="fc-shell">
  <aside class="fc-sidebar">
    <div class="fc-sidebar__brand">FinanceCash</div>
    <nav class="fc-sidebar__nav">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/lancamentos" routerLinkActive="active">Lançamentos</a>
      <a routerLink="/recorrencias" routerLinkActive="active">Recorrências</a>
      <a routerLink="/parcelamentos" routerLinkActive="active">Parcelamentos</a>
      <a routerLink="/importar" routerLinkActive="active">Importar</a>
      <a routerLink="/fechamento" routerLinkActive="active">Fechamento do Mês</a>
      <a routerLink="/categorias" routerLinkActive="active">Categorias</a>
      <a routerLink="/contas" routerLinkActive="active">Contas &amp; Saldos</a>
      <a routerLink="/cartoes" routerLinkActive="active">Cartões</a>
      <a routerLink="/relatorios" routerLinkActive="active">Relatórios</a>
      <a routerLink="/preferencias" routerLinkActive="active">Preferências</a>
    </nav>
    <div class="fc-sidebar__user">
      @if (authService.currentUser(); as user) {
        <span class="fc-sidebar__user-name">{{ user.name }}</span>
      }
      <button class="fc-sidebar__logout" (click)="logout()">Sair</button>
    </div>
  </aside>
  <main class="fc-content">
    <ng-content></ng-content>
  </main>
</div>
